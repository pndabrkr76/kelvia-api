# Bonus 6 : tous les services de compose.yaml, version Kubernetes.
# Les Services portent les mêmes noms que dans Compose (api, prometheus...) : les configs n'ont pas à changer.
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: kelvia-api}
  ports: [{port: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: conf, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
      volumes:
        - {name: conf, configMap: {name: prometheus-conf}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.3.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/provisioning/dashboards/kelvia.json}
          volumeMounts:
            - {name: dashboards, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
      volumes:
        - {name: dashboards, configMap: {name: grafana-dashboards}}
        - {name: datasources, configMap: {name: grafana-datasources}}
---
apiVersion: v1
kind: Service
metadata: {name: vitrine}
spec:
  selector: {app: vitrine}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vitrine}
spec:
  replicas: 1
  selector: {matchLabels: {app: vitrine}}
  template:
    metadata: {labels: {app: vitrine}}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: site, mountPath: /usr/share/nginx/html}
      volumes:
        - {name: site, configMap: {name: vitrine-site}}
---
apiVersion: v1
kind: Service
metadata: {name: kuma}
spec:
  selector: {app: kuma}
  ports: [{port: 3001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kuma}
spec:
  replicas: 1
  selector: {matchLabels: {app: kuma}}
  template:
    metadata: {labels: {app: kuma}}
    spec:
      containers:
        - name: kuma
          image: louislam/uptime-kuma:1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3001}]
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - {name: data, emptyDir: {}}
